# Dedicated key accepts only forwarding to the bot's loopback WebSocket and authenticated sending endpoint.
Match User airlert-tunnel
    AuthorizedKeysFile /etc/airlert/tunnel_authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:3001 127.0.0.1:3002
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
Match all
